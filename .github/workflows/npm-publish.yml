# Publishes @operatiemobilisatie/ui to GitHub Packages.
# Dispatch from the branch you want to release: pick `v3` with tag `beta` for a
# prerelease, `main` with tag `latest` for a stable one. The build itself runs
# via the package's `prepublishOnly` hook, so it cannot be skipped.
name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        required: true
        default: beta

permissions:
  contents: read
  packages: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run typecheck
      # publint and attw both inspect `dist/`, which is gitignored, so the
      # build has to happen before them on a fresh checkout. `prepublishOnly`
      # rebuilds during `npm publish` as a backstop; that is cheap and means a
      # publish can never ship an unbuilt tree.
      - run: npm run build
      - run: npx publint
      # NPM_TOKEN, not GITHUB_TOKEN. GITHUB_TOKEN may only write to a package
      # that is linked to this repository, and @operatiemobilisatie/ui predates
      # this workflow -- it was created org-level via a PAT, so it has no
      # linkage and GITHUB_TOKEN gets `permission_denied: write_package`.
      # Linking it (org > Packages > ui > Manage Actions access) would let us
      # drop the PAT; until then this is the token that works.
      - run: npm publish --tag "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
